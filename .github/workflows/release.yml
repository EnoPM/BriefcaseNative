name: Publish server release
run-name: Server release from VERSION (${{ inputs.draft && 'draft' || 'publish' }})

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Keep the release as a draft'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: briefcase-server-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify framework source inventory
        run: python ./scripts/release/Assert-Source.py

      - name: Validate version and source revision
        run: |
          $version = ./scripts/release/Read-Version.ps1
          ./scripts/release/Test-ReleaseVersion.ps1 -Version $version -Commit $env:GITHUB_SHA
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install the tested Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          if ($LASTEXITCODE) { throw 'Rust toolchain installation failed.' }
          rustc --version
          cargo --version

      - name: Fetch pinned dependencies
        env:
          UPSTREAM_READ_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
        run: |
          if (-not $env:UPSTREAM_READ_TOKEN) { throw 'UPSTREAM_READ_TOKEN is required to read the Unreal submodule.' }
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:'+$env:UPSTREAM_READ_TOKEN))
          Write-Output "::add-mask::$encoded"
          $env:GIT_CONFIG_COUNT='1'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+$encoded
          ./scripts/build/Fetch-Dependencies.ps1

      - name: Build Release x64
        run: ./scripts/build/Build.ps1

      - name: Test and package
        run: ./scripts/client/Package-Client.ps1

      - name: Test release publication contracts
        run: ./tests/ReleaseWorkflow.Contracts.ps1

      - name: Test updater with Windows PowerShell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/Updater.Contracts.ps1
          if ($LASTEXITCODE) { throw 'Windows PowerShell updater contracts failed.' }

      - name: Store the server release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-release
          path: |
            dist/Releases/BriefcaseNative-Server-windows-x64-${{ env.RELEASE_VERSION }}.zip
            dist/Releases/BriefcaseNative-SDK-${{ env.RELEASE_VERSION }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Store test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results
          path: build/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-release
          path: dist/Releases

      - name: Create and verify the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = ./scripts/release/Read-Version.ps1
          ./scripts/release/Publish-Release.ps1 -Version $version -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY -Draft

  linux:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/linux-server-release.yml
    with:
      publish: ${{ !inputs.draft }}
    secrets: inherit
