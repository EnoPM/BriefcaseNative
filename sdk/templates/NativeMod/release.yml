name: Publish mod release
on:
 workflow_dispatch:
  inputs:
   version:
    description: Version in CMakeLists.txt and briefcase.mod.json
    required: true
    type: string
   draft:
    description: Keep as draft
    type: boolean
    default: false
permissions:
 contents: read
concurrency:
 group: mod-release
 cancel-in-progress: false
defaults:
 run:
  shell: pwsh
jobs:
 build:
  runs-on: windows-2025
  timeout-minutes: 30
  env:
   SCCACHE_GHA_ENABLED: "true"
   CMAKE_C_COMPILER_LAUNCHER: sccache
   CMAKE_CXX_COMPILER_LAUNCHER: sccache
  steps:
   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
     with:
      ref: ${{ github.sha }}
      fetch-depth: 0
      persist-credentials: false
   - name: Configure compiler cache
     uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
     with:
      version: v0.16.0
   - name: Validate
     env:
      VERSION: ${{ inputs.version }}
     run: ./scripts/Validate-Release.ps1 -Version $env:VERSION -Commit $env:GITHUB_SHA
   - name: Fetch SDK, build and test
     run: ./scripts/Build.ps1
   - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
     with:
      name: mod-release
      path: |
       dist/*.zip
       dist/*.sha256
      if-no-files-found: error
 publish:
  needs: build
  runs-on: windows-2025
  timeout-minutes: 10
  permissions:
   contents: write
  steps:
   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
     with:
      ref: ${{ github.sha }}
      fetch-depth: 0
      persist-credentials: false
   - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
     with:
      name: mod-release
      path: dist
   - name: Publish verified assets
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      DRAFT: ${{ inputs.draft }}
     run: ./scripts/Publish.ps1 -Version $env:VERSION -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY -Draft:($env:DRAFT -eq 'true')
