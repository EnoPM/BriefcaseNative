name: Publish mod release
on:
 workflow_dispatch:
  inputs:
   version:
    description: Version in CMakeLists.txt and briefcase.mod.json
    required: true
    type: string
   draft:
    description: Keep as draft
    type: boolean
    default: false
permissions:
 contents: read
concurrency:
 group: mod-release
 cancel-in-progress: false
defaults:
 run:
  shell: pwsh
jobs:
 build:
  runs-on: windows-2025
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
     with:
      ref: ${{ github.sha }}
      fetch-depth: 0
      persist-credentials: false
   - name: Validate
     env:
      VERSION: ${{ inputs.version }}
     run: ./scripts/Validate-Release.ps1 -Version $env:VERSION -Commit $env:GITHUB_SHA
   - name: Fetch SDK, build and test
     run: ./scripts/Build.ps1
   - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
     with:
      name: mod-release
      path: |
       dist/*.zip
       dist/*.sha256
      if-no-files-found: error
 publish:
  needs: build
  runs-on: windows-2025
  timeout-minutes: 10
  permissions:
   contents: write
  steps:
   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
     with:
      ref: ${{ github.sha }}
      fetch-depth: 0
      persist-credentials: false
   - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
     with:
      name: mod-release
      path: dist
   - name: Publish verified assets
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      DRAFT: ${{ inputs.draft }}
     run: ./scripts/Publish.ps1 -Version $env:VERSION -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY -Draft:($env:DRAFT -eq 'true')
